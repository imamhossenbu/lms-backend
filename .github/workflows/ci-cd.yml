name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Quality Check (Continuous Integration)
  # -------------------------------------------------------------
  ci-build:
    name: Build & Verify TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Compile TypeScript Application
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: Docker Build & Verification
  # -------------------------------------------------------------
  docker-build:
    name: Build & Verify Docker Image
    needs: ci-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: lms-ai-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # Job 3: Continuous Deployment (Trigger on main branch push)
  # -------------------------------------------------------------
  cd-deploy:
    name: Automated Deployment
    needs: [ci-build, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deployment Notification
        run: |
          echo "✅ CI/CD Build and Docker verification passed successfully!"
          echo "🚀 Ready for deployment to production server / container registry."

      # Optional: Trigger Render / Railway Deploy Hook if configured
      - name: Trigger Webhook Deploy (if DEPLOY_HOOK_URL secret exists)
        if: env.DEPLOY_HOOK_URL != ''
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$DEPLOY_HOOK_URL"
